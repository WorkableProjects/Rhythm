name: CI

on:
  # Pull requests cover feature branches; pushes to main cover merges. Avoids running the
  # macOS job twice for every push to a branch with an open PR.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests-linux:
    name: RhythmCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Test RhythmCore
        working-directory: Packages/RhythmCore
        run: swift test

  ios-build-and-test:
    name: iOS build and tests (Xcode)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Build and test
        run: scripts/ci-ios.sh
